ices": []}, {"q": "If a>0, which expression equals a^(3/2)·a^(1/2)?", "a": "a²", "s": "Add exponents 3/2+1/2=2.", "choices": ["a³", "a", "a²", "a^(3/4)"]}, {"q": "A quantity is 160 at t=2 and 640 at t=4 in an exponential model. What is its value at t=0?", "a": "40", "s": "Two-period factor 4; divide 160 by 4.", "choices": []}, {"q": "A substance halves every 3 hours. What percent remains after 9 hours?", "a": "12.5", "s": "100(1/2)³=12.5.", "choices": []}, {"q": "If 4^(x+2)=8^(x−1), what is x?", "a": "7", "s": "2x+4=3x−3.", "choices": []}]}, {"name": "Rational and radical equations", "domain": "Advanced Math", "ref": "4 M2 Q23; 11 M1 Q21 (algebraic manipulation)", "hint": "Desmos: graph both sides and inspect intersections in the domain. TI-84: use Y= and intersect; verify candidates in original equation.", "qs": [{"q": "For x≠0, which expression equals 6/x + 6x?", "a": "(6+6x²)/x", "s": "Use common denominator x.", "choices": ["12x", "12/x", "(6+6x)/x", "(6+6x²)/x"]}, {"q": "If √(x+9)=x−3, what is x?", "a": "7", "s": "Square: x+9=x²−6x+9, so x=0 or 7; only 7 satisfies x≥3.", "choices": []}, {"q": "If 3/(x−2)=1/4, what is x?", "a": "14", "s": "Cross multiply: x−2=12.", "choices": []}, {"q": "For x≠3, which equals (x²−9)/(x−3)?", "a": "x+3", "s": "Factor numerator and cancel x−3.", "choices": ["x²+3", "x+3", "x", "x−3"]}, {"q": "If √(2x+1)=5, what is x?", "a": "12", "s": "2x+1=25.", "choices": []}, {"q": "For positive a, which equals √(48a²)?", "a": "4a√3", "s": "48=16×3; √a²=a.", "choices": ["4a√12", "16a√3", "4a√3", "8a√3"]}, {"q": "If 5/(x+1)=2, what is x?", "a": "1.5", "s": "x+1=2.5.", "choices": []}, {"q": "If √(x+6)=x, what is x?", "a": "3", "s": "x²−x−6=0; roots 3 and −2; reject negative.", "choices": []}]}, {"name": "Percent change and ratios", "domain": "Problem-Solving and Data Analysis", "ref": "5 M1 Q17; 4 M1 Q2 (proportional reasoning)", "hint": "Desmos/TI-84: use multiplicative factors and parentheses; reverse a change by division.", "qs": [{"q": "A price rises 25% then falls 20%. What is the overall percent change?", "a": "0", "s": "1.25×0.8=1.", "choices": []}, {"q": "A sale price of $84 is 30% below original. What was the original price?", "a": "120", "s": "84/0.7=120.", "choices": []}, {"q": "A is 40% greater than B. B is 50% greater than C. A is what percent of C?", "a": "210", "s": "1.4×1.5×100=210.", "choices": []}, {"q": "A mixture has red and blue in ratio 3:5. Adding 12 red units makes the ratio 1:1. How many blue units were originally present?", "a": "30", "s": "5k−3k=12; k=6.", "choices": []}, {"q": "A map uses 1 cm for 8 km. A region covers 5 cm² on the map. Actual area in km²?", "a": "320", "s": "Area factor 8²=64; multiply by 5.", "choices": []}, {"q": "A rate is 72 km/hour. What is it in meters/second?", "a": "20", "s": "72×1000/3600=20.", "choices": []}, {"q": "A value falls from 250 to 190. Percent decrease?", "a": "24", "s": "60/250×100=24.", "choices": []}, {"q": "A price after a 15% increase is $230. Original price?", "a": "200", "s": "230/1.15=200.", "choices": []}]}, {"name": "Statistics and inference", "domain": "Problem-Solving and Data Analysis", "ref": "11 M1 Q22; 4 M2 Q10", "hint": "Desmos: mean(list) or weighted sum. TI-84: STAT EDIT, 1-Var Stats with frequency list when appropriate.", "qs": [{"q": "A group of 30 has mean 18; a group of 20 has mean 28. What is the combined mean?", "a": "22", "s": "(30×18+20×28)/50=22.", "choices": []}, {"q": "A random sample estimates 48% with margin 4 percentage points. Which value is outside the interval?", "a": "53%", "s": "Interval 44%–52%.", "choices": ["53%", "52%", "50%", "44%"]}, {"q": "Which change generally reduces margin of error for the same sampling method?", "a": "Increase random sample size", "s": "Larger random samples generally reduce sampling variability.", "choices": ["Survey only volunteers", "Increase random sample size", "Change the population", "Decrease sample size"]}, {"q": "<table><tr><th>Value</th><th>1</th><th>3</th><th>5</t function validateProgress(data){

  function answers(source,count){
